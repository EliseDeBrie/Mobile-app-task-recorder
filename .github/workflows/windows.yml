name: Windows

# The tool runs on Windows and nowhere else, so that is where it is tested and
# built. A Windows OCR call that was wrong for the installed packages reached a
# user once; a test run on a real Windows machine is how that stops happening.
#
# Each action below is pinned to the commit its version tag pointed at when it
# was checked, not to the tag: a tag can be moved to other code, a commit
# cannot. Dependabot (.github/dependabot.yml) opens a pull request when a
# newer one is out, and updates the comment with it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in pyproject.toml"
        type: boolean
        default: false

# The token can read the repository and nothing more, except where a job says
# otherwise below.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the tool and its test extras
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -c packaging/constraints.txt ".[dev,ocr-windows,window]" pip-audit

      - name: Check the installed packages against the vulnerability databases
        # Free, and the same check a Store or a corporate desk would run on the
        # package. A finding here fails the build until the pin in
        # packaging/constraints.txt is moved to a fixed version.
        run: python -m pip_audit --progress-spinner off

      - name: Run the tests
        run: python -m pytest -q

      - name: Check what this machine can do
        run: whs-recorder check

  build:
    runs-on: windows-latest
    needs: test
    permissions:
      # Creating the release and attaching the executable to it is a write.
      # Without this the tag build gets "Resource not accessible by
      # integration" from the releases API and the tag produces nothing.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the tool, its OCR engine and PyInstaller
        # Pinned to packaging/constraints.txt, so a release is built from a
        # known set of versions and can be built again.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -c packaging/constraints.txt ".[ocr-windows,window]" pyinstaller pillow

      - name: Build the executable
        run: pyinstaller --noconfirm --clean packaging/whs-recorder.spec

      - name: Confirm the executable runs, and that OCR survived packaging
        run: |
          & ".\dist\WHS Task Recorder.exe" --version
          $report = & ".\dist\WHS Task Recorder.exe" check | Out-String
          Write-Host $report

          # The WinRT modules are reached through importlib, so a packaging
          # mistake drops them silently and the check still exits zero. Reading
          # a test image through the bundled engine is what proves they are in
          # there.
          if ($report -notmatch 'reading a test image with windows: read "WHS RECORDER 12345"') {
            Write-Error "The packaged program cannot read text. The WinRT modules did not make it into the build."
            exit 1
          }

      - name: Build a document with the packaged program
        # A document is what the program is for. python-docx carries a template
        # that has to be packed in with the executable, and nothing above would
        # notice if it were not.
        run: |
          python packaging\smoke.py smoke
          # Piped, so PowerShell waits for it: the program is a windowed one,
          # and a windowed program returns to the shell at once unless its
          # output is being read. Without this the check below ran first.
          $built = & ".\dist\WHS Task Recorder.exe" build --markers smoke\recording.json --out smoke\build --document smoke\guide.docx --skip-loading | Out-String
          Write-Host $built
          if (-not (Test-Path smoke\guide.docx)) {
            Write-Error "The packaged program built no document."
            exit 1
          }
          python -c "import sys, zipfile; media = [n for n in zipfile.ZipFile('smoke/guide.docx').namelist() if n.startswith('word/media/')]; print('pictures in the document:', len(media)); sys.exit(0 if len(media) == 2 else 1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WHS-Task-Recorder-windows
          path: dist/WHS Task Recorder.exe
          if-no-files-found: error

      # ---------------------------------------------------- the Store package
      # The Store signs what it publishes, so this is the build that needs no
      # certificate. It is the same program laid out as a folder, packed with
      # the manifest in packaging/msix. The identity comes from repository
      # variables (Settings > Secrets and variables > Actions > Variables),
      # copied from Partner Center once the app's name is reserved; until
      # they are set the package carries placeholders and is for trying out,
      # not for uploading. See docs/STORE.md.

      - name: Build the program as a folder
        env:
          WHS_BUILD: folder
        run: pyinstaller --noconfirm --clean --distpath dist-folder packaging/whs-recorder.spec

      - name: Confirm the folder build runs
        run: |
          $version = & ".\dist-folder\WHS Task Recorder\WHS Task Recorder.exe" --version | Out-String
          Write-Host $version
          if ($version -notmatch 'whs-recorder \d') {
            Write-Error "The folder build does not start."
            exit 1
          }

      - name: Pack the Store package
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: python packaging\make_msix.py --dist "dist-folder\WHS Task Recorder" --out dist\msix

      - name: Confirm the package holds the program and a valid manifest
        run: |
          if (-not (Test-Path "dist\msix\WHS Task Recorder.msix")) {
            Write-Error "No Store package came out."
            exit 1
          }
          # An .msix is a zip, with backslashes in its names. The program and
          # the manifest have to be in it.
          python -c "import sys, zipfile; names = [n.replace(chr(92), '/') for n in zipfile.ZipFile('dist/msix/WHS Task Recorder.msix').namelist()]; print(len(names), 'files'); sys.exit(0 if 'AppxManifest.xml' in names and 'app/WHS Task Recorder.exe' in names else 1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WHS-Task-Recorder-msix
          path: dist/msix/WHS Task Recorder.msix
          if-no-files-found: error

      - name: Read the version being released
        id: version
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          "tag=v$version" >> $env:GITHUB_OUTPUT

      # A release normally comes from pushing a tag. Running this workflow by
      # hand with 'publish' ticked does the same thing, tagging whatever
      # version pyproject.toml carries - which is the only route available
      # where tags cannot be pushed.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            dist/WHS Task Recorder.exe
            dist/msix/WHS Task Recorder.msix
          body: |
            Download **WHS.Task.Recorder.exe** from the Assets list below and
            run it. Nothing else to install: no Python, no packages, no
            terminal. (GitHub shows the name with dots instead of spaces.)

            Windows will warn that the file is unsigned the first time. Choose
            **More info**, then **Run anyway**.

            The **.msix** beside it is the same program as a Store package. It
            is unsigned, so it is for the Store upload and for trying out
            (`Add-AppxPackage -AllowUnsigned`), not for installing by hand.
