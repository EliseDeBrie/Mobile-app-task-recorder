[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-app-task-recorder"
version = "0.2.0"
description = "Offline evidence builder for D365 WMS mobile processes"
authors = [{name = "D365Solutions"}]
license = {text = "GPL-3.0"}
requires-python = ">=3.10"

dependencies = [
    "opencv-python",
    "python-docx",
    "numpy",
    "pynput",
    "mss"
]

[project.optional-dependencies]
ocr = ["pytesseract"]
dev = ["pytest"]

[project.scripts]
whs-recorder = "whs_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
