[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-app-task-recorder"
version = "0.9.4"
description = "Offline evidence builder for D365 WMS mobile processes"
authors = [{name = "D365Solutions"}]
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "opencv-python",
    "python-docx",
    "numpy",
    "pynput",
    "mss"
]

[project.optional-dependencies]
# The OCR engine built into Windows. Nothing to install beyond these wheels,
# and no administrator rights.
ocr-windows = [
    "winrt-Windows.Media.Ocr[all]; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging[all]; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]
# Tesseract, for machines where Windows OCR is unavailable. The binary itself
# is separate: a portable copy works, so its installer can be avoided.
ocr = ["pytesseract"]
window = ["pygetwindow"]
dev = ["pytest"]

[project.scripts]
whs-recorder = "whs_recorder.cli:main"

# The same program without a console window, for a desktop or Start menu
# shortcut. Double-clicking either one opens the launcher.
[project.gui-scripts]
whs-recorder-app = "whs_recorder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whs_recorder = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
